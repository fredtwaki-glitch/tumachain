<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TumaChain Payment Request</title><style>body{margin:0;background:#05070d;color:#eef2fb;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{width:min(520px,calc(100% - 32px));padding:30px;background:#0c1220;border:1px solid #1c2940;border-radius:20px}.muted{color:#93a0ba}.amount{font-size:48px;font-weight:900;margin:15px 0}.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:#69a7ff;font-weight:800;margin-top:20px}</style></head><body><div class="card"><div class="muted">TumaChain · Payment Request</div><h1 id="name">Payment Request</h1><div class="amount" id="amount">Loading…</div><p id="desc" class="muted"></p><span class="muted">TESTNET / SANDBOX</span><button class="btn" onclick="location.href='/login'">Pay with TumaChain</button></div><script>const code=location.pathname.split('/').pop();fetch('/api/v1/payment-links/'+encodeURIComponent(code)).then(r=>r.json()).then(d=>{document.getElementById('amount').textContent=Number(d.amount).toLocaleString(undefined,{minimumFractionDigits:2})+' '+d.asset;document.getElementById('desc').textContent=d.description||'Payment request';if(d.status==='EXPIRED')document.getElementById('amount').textContent='Expired'}).catch(()=>document.getElementById('amount').textContent='Request unavailable')</script></body></html>
